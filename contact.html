<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Crib Furniture</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="siteHeader"></header>
<main>
  <section class="page-hero">
    <div class="container">
      <p class="breadcrumb"><a href="/index.html">Home</a> / <span>Contact</span></p>
      <h1 style="font-size:2.2rem;margin-top:8px">Get in <span class="accent">Touch</span></h1>
    </div>
  </section>

  <section class="section" style="padding-top:20px">
    <div class="container" style="display:grid;grid-template-columns:1fr 1fr;gap:40px">
      <div>
        <p>Have a question about an order, a custom build, or just want to say hi? Reach us on WhatsApp for the fastest reply, or send a message below.</p>
        <ul style="margin:20px 0">
          <li style="margin-bottom:10px"><strong>Phone:</strong> <a data-phone href="#">Loading…</a></li>
          <li style="margin-bottom:10px"><strong>Email:</strong> <a data-email href="#">Loading…</a></li>
          <li><strong>Address:</strong> <span data-address>Loading…</span></li>
        </ul>
        <iframe data-map src="" width="100%" height="260" style="border:0;border-radius:14px" loading="lazy"></iframe>
      </div>
      <form onsubmit="event.preventDefault(); toast('Message sent — we will reply shortly.'); this.reset();">
        <div class="form-row"><label>Name</label><input required></div>
        <div class="form-row"><label>Email</label><input type="email" required></div>
        <div class="form-row"><label>Message</label><textarea rows="5" required></textarea></div>
        <button class="btn btn-primary btn-block" type="submit">Send message</button>
      </form>
    </div>
  </section>
</main>
<footer class="site-footer" id="siteFooter"></footer>
<script src="/js/data.js"></script>
<script src="/js/common.js"></script>
</body>
</html>
