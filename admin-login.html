<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Login — Crib Furniture</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .pw-wrap{position:relative}
  .pw-wrap input{width:100%;padding-right:44px;box-sizing:border-box}
  .pw-toggle{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;font-size:1.05rem;
    line-height:1;padding:6px;opacity:.55;
  }
  .pw-toggle:hover{opacity:1}
</style>
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <a href="/index.html" class="logo">Crib Furniture</a>

    <div id="loginView">
      <h1 style="font-size:1.4rem;margin-top:18px">Staff &amp; Admin Login</h1>
      <p style="margin-top:6px">Sign in to the admin panel.</p>

      <form id="loginForm" style="margin-top:22px;text-align:left">
        <div class="form-row"><label>Email</label><input id="loginEmail" type="email" required autocomplete="username"></div>
        <div class="form-row"><label>Password</label>
          <div class="pw-wrap">
            <input id="loginPassword" type="password" required autocomplete="current-password">
            <button type="button" class="pw-toggle" data-target="loginPassword" aria-label="Show password">👁</button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>

      <p id="loginError" class="pending-note" style="display:none;color:var(--danger)"></p>

      <p style="margin-top:18px;font-size:.9rem">
        New staff member? <a href="#" id="showRegister">Request access</a>
      </p>
    </div>

    <div id="registerView" style="display:none">
      <h1 style="font-size:1.4rem;margin-top:18px">Request Staff Access</h1>
      <p style="margin-top:6px">A senior admin reviews and approves every new account before it can make changes.</p>

      <form id="registerForm" style="margin-top:22px;text-align:left">
        <div class="form-row"><label>Full name</label><input id="regName" required autocomplete="name"></div>
        <div class="form-row"><label>Email</label><input id="regEmail" type="email" required autocomplete="username"></div>
        <div class="form-row"><label>Password (min 8 characters)</label>
          <div class="pw-wrap">
            <input id="regPassword" type="password" minlength="8" required autocomplete="new-password">
            <button type="button" class="pw-toggle" data-target="regPassword" aria-label="Show password">👁</button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Request access</button>
      </form>

      <p id="registerError" class="pending-note" style="display:none;color:var(--danger)"></p>

      <p style="margin-top:18px;font-size:.9rem">
        Already have an account? <a href="#" id="showLogin">Back to sign in</a>
      </p>
    </div>

    <p id="pendingMsg" class="pending-note" style="display:none"></p>
  </div>
</div>

<script>
(function () {
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.textContent = showing ? '👁' : '🙈';
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });
  });
})();
</script>
<script>
(function () {
  const loginView = document.getElementById('loginView');
  const registerView = document.getElementById('registerView');
  const pendingMsg = document.getElementById('pendingMsg');

  document.getElementById('showRegister').addEventListener('click', (e) => {
    e.preventDefault();
    loginView.style.display = 'none';
    registerView.style.display = 'block';
    pendingMsg.style.display = 'none';
  });

  document.getElementById('showLogin').addEventListener('click', (e) => {
    e.preventDefault();
    registerView.style.display = 'none';
    loginView.style.display = 'block';
    pendingMsg.style.display = 'none';
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    try {
      const res = await fetch('/.netlify/functions/auth-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error || 'Sign in failed.';
        errorEl.style.display = 'block';
        return;
      }
      localStorage.setItem('woodora_token', data.token);
      localStorage.setItem('woodora_role', data.role);
      localStorage.setItem('woodora_email', data.email);
      location.href = '/admin.html';
    } catch (err) {
      errorEl.textContent = 'Could not reach the server. Please try again.';
      errorEl.style.display = 'block';
    }
  });

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('registerError');
    errorEl.style.display = 'none';
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;

    try {
      const res = await fetch('/.netlify/functions/auth-register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error || 'Could not submit request.';
        errorEl.style.display = 'block';
        return;
      }
      registerView.style.display = 'none';
      loginView.style.display = 'none';
      pendingMsg.textContent = "Request sent. You'll be able to sign in once a senior admin approves your account.";
      pendingMsg.style.display = 'block';
    } catch (err) {
      errorEl.textContent = 'Could not reach the server. Please try again.';
      errorEl.style.display = 'block';
    }
  });
})();
</script>
</body>
</html>
